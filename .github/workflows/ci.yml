name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Sin API_URL: el build y las pruebas usan los datos mock.
  # Los E2E (Playwright) no corren aquí: necesitan el backend y la base con los 1025 Pokémon.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # S-17: dependencias de producción sin vulnerabilidades altas o críticas
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test
      - run: npm run build
